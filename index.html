<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adnan.120hz</title>
    <style>
        :root {
            --text-dark: #1e3a8a; 
            --text-sub: #64748b;  
            --blue-accent: #3b82f6;
            --glass-border: rgba(255, 255, 255, 0.8);
            --glass-bg: rgba(255, 255, 255, 0.55);
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: var(--text-dark);
            
            /* BACKGROUND: Ganti bagian ini dengan URL gambar iPhone kamu */
            /* Contoh: url('https://adnan120hz-redesign-ui.vercel.app/iphone_14_blue.png') */
            background-image: 
                url('https://adnan120hz-redesign-ui.vercel.app/iphone_17_silver.png'),
                url('https://adnan120hz-redesign-ui.vercel.app/iphone_14_blue.png'),
                linear-gradient(135deg, #ffffff 0%, #eff6ff 40%, #bfdbfe 100%);
            
            background-position: left bottom, right top, center;
            background-size: 300px, 250px, cover;
            background-repeat: no-repeat, no-repeat, no-repeat;
            background-attachment: fixed;

            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .glow {
            position: fixed;
            top: -20%;
            left: 50%;
            transform: translateX(-50%);
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.3) 0%, transparent 70%);
            border-radius: 50%;
            z-index: -1;
            pointer-events: none;
        }

        .container {
            width: 90%;
            max-width: 600px;
            padding: 40px 0;
            text-align: center;
            z-index: 10;
        }

        header {
            margin-bottom: 40px;
        }

        /* LOGO APPLE SILUET (Brand Apple) */
        .apple-logo {
            width: 50px;
            height: 60px;
            margin: 0 auto 15px auto;
            color: var(--text-dark);
            filter: drop-shadow(0 2px 10px rgba(59, 130, 246, 0.4));
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin: 0 0 8px 0;
            color: var(--text-dark);
        }

        p.subtitle {
            font-size: 0.85rem;
            color: var(--text-sub);
            margin-bottom: 0;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
        }

        /* LIQUID GLASS GRID */
        .card-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 25px 15px;
            text-decoration: none;
            color: var(--text-dark);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(15px) saturate(180%);
            -webkit-backdrop-filter: blur(15px) saturate(180%);
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.15);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        /* REFLECTION / PANTAULAN CAHAYA */
        .card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(115deg, transparent 35%, rgba(255, 255, 255, 0.6) 50%, transparent 65%);
            transform: rotate(10deg);
            pointer-events: none;
            transition: transform 0.5s;
        }

        .card:hover {
            background: rgba(255, 255, 255, 0.8);
            border-color: var(--blue-accent);
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 12px 40px rgba(59, 130, 246, 0.25);
        }

        .card:hover::before {
            transform: rotate(10deg) translateX(100%);
        }

        .card .icon {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        /* LABEL MEDIA SOSIAL */
        .card h3 {
            margin: 0;
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--blue-accent);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .card p {
            margin: 5px 0 0;
            font-size: 0.8rem;
            color: var(--text-sub);
            font-weight: 500;
        }

        /* CARD DONASI */
        .card.donate {
            grid-column: span 2;
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.9), rgba(37, 99, 235, 0.8));
            border-color: rgba(255, 255, 255, 0.4);
            padding: 20px;
            flex-direction: row;
            justify-content: space-between;
            text-align: left;
            color: #ffffff;
        }

        .card.donate:hover {
            background: linear-gradient(135deg, rgba(59, 130, 246, 1), rgba(37, 99, 235, 1));
            border-color: #ffffff;
            box-shadow: 0 12px 40px rgba(59, 130, 246, 0.4);
        }

        .card.donate::before {
            background: linear-gradient(115deg, transparent 35%, rgba(255, 255, 255, 0.4) 50%, transparent 65%);
        }

        .card.donate .text-wrap {
            flex: 1;
            padding-right: 10px;
        }

        .card.donate h3 {
            color: #ffffff;
            font-size: 1.2rem;
            margin-bottom: 5px;
        }

        .card.donate p {
            color: rgba(255, 255, 255, 0.9);
            font-size: 0.85rem;
        }

        .card.donate .arrow {
            font-size: 2rem;
            color: #ffffff;
        }

        footer {
            margin-top: 30px;
            font-size: 0.75rem;
            color: var(--text-sub);
            padding-bottom: 20px;
        }

        @media (max-width: 400px) {
            .card-grid {
                grid-template-columns: 1fr;
            }
            .card.donate {
                grid-column: span 1;
            }
        }
    </style>
</head>
<body>

    <div class="glow"></div>

        <header>

            </svg>
            
            <h1>Welcome to Adnan.120hz</h1>
            <p class="subtitle">Apple Security Research</p>
        </header>

        <div class="card-grid">
            <!-- 1. Discord -->
            <a href="https://discord.gg/YdNwz7uAR" class="card">

            </a>

            <!-- 2. Telegram Adnan -->

            <!-- 4. GitHub -->
            <a href="https://github.com/gievano/WorkPlot" class="card">

            <!-- Donasi (Link baru) -->
            <a href="https://adnan120hz-redesign-ui.vercel.app/IMG_1097.jpeg" class="card donate">

                    <h3>💰 Donation</h3>

        </div>

        <footer>
            © 2026 Adnan.120hz. All rights reserved.
        </footer>
    </div>

</body>
</html>
