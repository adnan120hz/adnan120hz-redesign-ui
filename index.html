<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adnan.120hz</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #000000;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 90%;
            max-width: 600px;
            padding: 40px 0;
            text-align: center;
        }

        header {
            margin-bottom: 40px;
        }

        .apple-logo {
            width: 50px;
            height: 60px;
            margin: 0 auto 15px auto;
            color: #ffffff;
            filter: drop-shadow(0 0 15px rgba(59, 130, 246, 0.5));
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin: 0 0 8px 0;
            color: #ffffff;
        }

        p.subtitle {
            font-size: 0.85rem;
            color: #888888;
            margin-bottom: 0;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
        }

        /* 2x2 GRID ala Ketamine/WorkPlot */
        .card-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        /* KARTU BIRU (SEMUA TOMBOL) */
        .card {
            background: linear-gradient(135deg, #3b82f6, #2563eb); /* Biru Gradasi */
            border: none;
            border-radius: 12px; /* Kotak persegi */
            padding: 30px 15px;
            text-decoration: none;
            color: #ffffff;
            transition: transform 0.3s, box-shadow 0.3s, background 0.3s;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            box-shadow: 0 8px 20px rgba(37, 99, 235, 0.3);
        }

        .card:hover {
            transform: translateY(-4px);
            background: linear-gradient(135deg, #60a5fa, #3b82f6); /* Lebih terang saat hover */
            box-shadow: 0 12px 30px rgba(59, 130, 246, 0.5);
        }

        .card .icon {
            font-size: 2.5rem;
            margin-bottom: 15px;
        }

        .card h3 {
            margin: 0;
            font-size: 1.1rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .card p {
            margin: 5px 0 0;
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.85);
        }

        /* KARTU DONATE (LEBAR PENUH) */
        .card.donate {
            grid-column: span 2;
            background: linear-gradient(135deg, #60a5fa, #2563eb);
            padding: 20px;
            flex-direction: row;
            justify-content: space-between;
            text-align: left;
            border-radius: 12px;
        }

        .card.donate:hover {
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            box-shadow: 0 12px 40px rgba(59, 130, 246, 0.6);
        }

        .card.donate .text-wrap {
            flex: 1;
            padding-right: 10px;
        }

        .card.donate h3 {
            color: #ffffff;
            font-size: 1.2rem;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .card.donate p {
            color: rgba(255, 255, 255, 0.9);
            font-size: 0.85rem;
        }

        .card.donate .arrow {
            font-size: 2.5rem;
            color: #ffffff;
            font-weight: 200;
        }

        footer {
            margin-top: 30px;
            font-size: 0.75rem;
            color: #555555;
            padding-bottom: 20px;
        }

        @media (max-width: 400px) {
            .card-grid {
                grid-template-columns: 1fr;
            }
            .card.donate {
                grid-column: span 1;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <!-- Logo Apple Siluet Putih -->
            <svg class="apple-logo" viewBox="0 0 814 1000" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M788.1 340.9c-5.8 4.5-108.2 62.2-108.2 190.5 0 148.4 130.3 200.9 134.2 202.2-.6 3.2-20.7 71.9-68.7 141.9-42.8 61.6-87.5 123.1-155.5 123.1s-85.5-39.5-164-39.5c-76.5 0-103.7 40.8-165.9 40.8s-105.6-57-155.5-127C46.7 790.7 0 663 0 541.8c0-194.4 126.4-297.5 250.8-297.5 66.1 0 121.2 43.4 162.7 43.4 39.5 0 101.1-46 176.3-46 28.5 0 130.9 2.6 198.3 99.2zm-234-181.5c31.1-36.9 53.1-88.1 53.1-139.3 0-7.1-.6-14.3-1.9-20.1-50.6 1.9-110.8 33.7-147.1 75.8-28.5 32.4-55.1 83.6-55.1 135.5 0 7.8 1.3 15.6 1.9 18.1 3.2.6 8.4 1.3 13.6 1.3 45.4 0 102.5-30.4 135.5-71.3z" fill="currentColor"/>
            </svg>
            
            <h1>Welcome to Adnan.120hz</h1>
            <p class="subtitle">Apple Security Research</p>
        </header>

        <!-- 4 Susunan Kartu Biru (2x2) -->
        <div class="card-grid">
            <!-- 1. Discord -->
            <a href="https://discord.gg/YdNwz7uAR" class="card">
                <div class="icon">💬</div>
                <h3>Discord</h3>
                <p>WorkPlot Community</p>
            </a>

            <!-- 2. Telegram Adnan -->
            <a href="https://t.me/adnan120hz" class="card">
                <div class="icon">📨</div>
                <h3>Telegram</h3>
                <p>Adnan.120hz Group</p>
            </a>

            <!-- 3. Telegram WorkPlot -->
            <a href="https://t.me/workplotios" class="card">
                <div class="icon">📢</div>
                <h3>Telegram</h3>
                <p>WorkPlot Group</p>
            </a>

            <!-- 4. GitHub -->
            <a href="https://github.com/gievano/WorkPlot" class="card">
                <div class="icon">🔧</div>
                <h3>GitHub</h3>
                <p>WorkPlot Source Code</p>
            </a>

            <!-- Donasi (Lebar Penuh di Bawah) -->
            <a href="https://adnan120hz-redesign-ui.vercel.app/IMG_1097.jpeg" class="card donate">
                <div class="text-wrap">
                    <h3>💰 Donation</h3>
                    <p>Support the Rebuild Misaka 27 Project!</p>
                </div>
                <span class="arrow">›</span>
            </a>
        </div>

        <footer>
            © 2026 Adnan.120hz. All rights reserved.
        </footer>
    </div>

</body>
</html>
